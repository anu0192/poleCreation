version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: feedback-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: mern-fairness-app
    volumes:
      - mongodb_data:/data/db
    networks:
      - feedback-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: feedback-server
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/mern-fairness-app?authSource=admin
      JWT_SECRET: dev_secret_key_change_in_production
      PORT: 5000
      NODE_ENV: development
    depends_on:
      - mongodb
    networks:
      - feedback-network
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: feedback-client
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://server:5000
    depends_on:
      - server
    networks:
      - feedback-network
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  feedback-network:
    driver: bridge
